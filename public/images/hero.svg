<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1f"/>
      <stop offset="1" stop-color="#1a1233"/>
    </linearGradient>
    <radialGradient id="pg" cx="940" cy="330" r="175" fx="880" fy="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc99b"/>
      <stop offset="0.4" stop-color="#e8501e"/>
      <stop offset="1" stop-color="#8f2a0e"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- nebula glows -->
  <ellipse cx="980" cy="480" rx="340" ry="170" fill="#e8501e" opacity="0.16" filter="url(#soft)"/>
  <ellipse cx="240" cy="140" rx="300" ry="140" fill="#6d5bd0" opacity="0.14" filter="url(#soft)"/>

  <!-- stars -->
