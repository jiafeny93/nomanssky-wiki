    <circle cx="810" cy="60" r="1.3" opacity="0.7"/><circle cx="880" cy="120" r="1.8" opacity="0.85"/>
    <circle cx="960" cy="70" r="1.2" opacity="0.6"/><circle cx="1050" cy="100" r="1.5" opacity="0.8"/>
    <circle cx="1130" cy="60" r="1.2" opacity="0.7"/><circle cx="700" cy="560" r="1.4" opacity="0.75"/>
    <circle cx="770" cy="590" r="1.1" opacity="0.5"/><circle cx="860" cy="550" r="1.6" opacity="0.8"/>
    <circle cx="940" cy="590" r="1.2" opacity="0.6"/><circle cx="1030" cy="560" r="1.5" opacity="0.8"/>
    <circle cx="1110" cy="590" r="1.2" opacity="0.6"/><circle cx="640" cy="180" r="1" opacity="0.45"/>
    <circle cx="60" cy="80" r="1.4" opacity="0.8"/><circle cx="150" cy="50" r="1.1" opacity="0.55"/>
    <circle cx="260" cy="90" r="1.3" opacity="0.65"/><circle cx="380" cy="55" r="1.6" opacity="0.8"/>
    <circle cx="490" cy="95" r="1.1" opacity="0.5"/><circle cx="550" cy="45" r="1.3" opacity="0.65"/>
    <circle cx="60" cy="560" r="1.3" opacity="0.7"/><circle cx="170" cy="590" r="1.1" opacity="0.5"/>
    <circle cx="300" cy="575" r="1.4" opacity="0.7"/><circle cx="430" cy="595" r="1.2" opacity="0.55"/>
    <circle cx="545" cy="565" r="1.5" opacity="0.75"/><circle cx="40" cy="300" r="1.2" opacity="0.55"/>
    <circle cx="30" cy="420" r="1.5" opacity="0.7"/><circle cx="1160" cy="330" r="1.3" opacity="0.65"/>
    <circle cx="1180" cy="450" r="1.1" opacity="0.5"/><circle cx="1150" cy="200" r="1.4" opacity="0.75"/>
    <circle cx="620" cy="320" r="1.6" opacity="0.8"/><circle cx="600" cy="420" r="1.2" opacity="0.55"/>
    <circle cx="660" cy="470" r="1.4" opacity="0.7"/><circle cx="590" cy="230" r="1.1" opacity="0.5"/>
  </g>

  <!-- ringed planet -->
  <g transform="rotate(-14 940 330)">
    <path d="M 700 330 A 240 62 0 0 1 1180 330" fill="none" stroke="#8a2f10" stroke-width="26" opacity="0.9"/>
  </g>
  <circle cx="940" cy="330" r="170" fill="url(#pg)"/>
  <ellipse cx="900" cy="270" rx="46" ry="26" fill="#c1441a" opacity="0.35"/>
  <ellipse cx="990" cy="380" rx="60" ry="30" fill="#8f2a0e" opacity="0.3"/>
  <ellipse cx="880" cy="390" rx="30" ry="16" fill="#c1441a" opacity="0.25"/>
  <g transform="rotate(-14 940 330)">
    <path d="M 700 330 A 240 62 0 0 0 1180 330" fill="none" stroke="#ffb37a" stroke-width="26" stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- small moon -->
  <circle cx="1155" cy="115" r="26" fill="#cfd6ea" opacity="0.9"/>
  <circle cx="1148" cy="110" r="5" fill="#aab4d4" opacity="0.8"/>
  <circle cx="1162" cy="122" r="3.4" fill="#aab4d4" opacity="0.7"/>

  <!-- text -->
  <text x="80" y="272" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="bold" fill="#ffffff">NO MAN&#8217;S SKY</text>
  <text x="80" y="368" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="bold" fill="#ff8c42">WIKI</text>
  <text x="82" y="432" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#aab4d4">Guides &#183; Expeditions &#183; Starships &#183; Cosmos Update</text>
  <text x="82" y="565" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7d88ab">nomanssky.wiki</text>
</svg>
